[package]
name = "sprocketstats-attendance"
version = "1.0.0"
description = "Team Sprocket attendance kiosk"
authors = ["Team Sprocket 3473"]
license = "ISC"
repository = "https://github.com/progteam3473/SprocketStats-Attendance"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
pcsc = "2"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
